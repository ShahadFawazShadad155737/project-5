<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>تواصل معنا - ماتشانا</title>
</head>
<body class="page-body">

    <header class="main-header">
        <img src="matchana.png" height="100" width="100" alt="matchana iogo">
        <h1 class="title">محبين الماتشا</h1>
        <h2 class="subtitle">أنتم في المكان الصحيح</h2>
    </header>

    <nav class="main-nav">
        <ul class="nav-list">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="login.html">تسجيل الدخول</a></li>
            <li><a href="about.html">من نحن</a></li>
            <li><a href="contact.html">تواصل معنا</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="contact-section">
            <h2 class="section-title">للتواصل معنا</h2>

            <p class="contact-text">
                يمكنك التواصل معنا من خلال كتابة اسمك والبريد الإلكتروني ثم كتابة رسالتك،
                وسيتم الرد عليك في أقرب وقت.
            </p>

            <form class="contact-form">
                <label for="name" class="form-label">اسم المستخدم</label>
                <input type="text" id="name" class="form-input">

                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-input">

                <label for="message" class="form-label">اكتب رسالتك</label>
                <textarea id="message" rows="5" class="form-textarea"></textarea>

                <button type="submit" class="submit-btn">إرسال الرسالة</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2025. All rights reserved.</p>
    </footer>

</body>
</html>
